<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - MessVoice</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            padding: 20px;
        }

        .card {

            width: 100%;

            max-width: 500px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {

            text-align: center;

            color: #333;

            margin-bottom: 10px;
        }

        .student-info {

            text-align: center;

            background: #f4f4ff;

            padding: 15px;

            border-radius: 10px;

            margin: 20px 0;
        }

        .student-info strong {

            color: #667eea;
        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #444;

            font-weight: bold;
        }

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 20px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 15px;

            outline: none;
        }

        input:focus {

            border-color: #667eea;
        }

        .reset-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: linear-gradient(
                135deg,
                #8e44ad,
                #667eea
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .back-btn {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>🔐 Reset Password</h1>

    <div class="student-info">

        Student:

        <strong>
            {{ student[2] }}
        </strong>

        <br>

        ID:

        <strong>
            {{ student[1] }}
        </strong>

    </div>


    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>
            New Password
        </label>

        <input
            type="password"
            name="new_password"
            placeholder="Enter new password"
            required
        >


        <label>
            Confirm New Password
        </label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            required
        >


        <button
            type="submit"
            class="reset-btn">

            🔐 Reset Password

        </button>

    </form>


    <a
        href="/admin/students"
        class="back-btn">

        ← Back to Students

    </a>

</div>

</body>

</html>
