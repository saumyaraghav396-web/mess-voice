<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - MessVoice</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .back {
            display: inline-block;
            margin-top: 20px;

            color: #667eea;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .security {
            margin-top: 25px;
            padding: 12px;

            background: #f5f6ff;
            border-radius: 10px;

            font-size: 13px;
            color: #666;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="icon">🔐</div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            MessVoice Administration Panel
        </p>

        <form method="POST" action="/admin">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter admin username"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <button type="submit">
                Login as Admin
            </button>

        </form>


        <a href="/" class="back">
            ← Back to Home
        </a>


        <div class="security">
            🛡️ Admin access is protected by password authentication.
        </div>

    </div>

</body>

</html>
