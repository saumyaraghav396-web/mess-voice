<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MessVoice | Student Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        p {
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        .forgot {
            display: block;
            margin-top: 15px;
            color: #667eea;
            text-decoration: none;
        }

        .register {
            display: block;
            margin-top: 10px;
            color: #667eea;
            text-decoration: none;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>🍽️ MessVoice</h1>

        <p>Student Login</p>

        <!-- IMPORTANT: Login ab /login par POST hoga -->
        <form action="/login" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


            <input
                type="text"
                name="student_id"
                placeholder="Enter Student ID"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <!-- Forgot Password -->
        <a href="/forgot-password" class="forgot">
            Forgot Password?
        </a>

        <!-- Register -->
        <a href="/register" class="register">
            Don't have an account? Register
        </a>

        <!-- Back -->
        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</body>

</html>
