
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MessVoice - Vote</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            padding: 30px 15px;
        }


        .container {

            max-width: 750px;

            margin: auto;

            background: white;

            padding: 35px;

            border-radius: 25px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.20);
        }


        /* HEADER */

        .header {

            text-align: center;

            margin-bottom: 30px;
        }


        .header-icon {

            font-size: 55px;

            margin-bottom: 10px;
        }


        h1 {

            color: #5b4bb7;

            margin-bottom: 8px;
        }


        .subtitle {

            color: #777;

            font-size: 16px;
        }


        /* INFO */

        .info {

            background: #eef0ff;

            color: #555;

            padding: 15px;

            border-radius: 12px;

            text-align: center;

            margin-bottom: 30px;

            line-height: 1.5;
        }


        /* SECTIONS */

        .section {

            margin-bottom: 30px;
        }


        .section-title {

            color: #444;

            margin-bottom: 12px;

            font-size: 21px;
        }


        /* OPTIONS */

        .option {

            display: flex;

            align-items: center;

            background: #f6f6f6;

            padding: 14px 16px;

            margin: 9px 0;

            border-radius: 12px;

            cursor: pointer;

            border: 2px solid transparent;

            transition: 0.25s;
        }


        .option:hover {

            background: #eef0ff;

            border-color: #667eea;

            transform: translateX(3px);
        }


        .option input {

            margin-right: 12px;

            width: 18px;

            height: 18px;

            cursor: pointer;
        }


        .option span {

            color: #333;

            font-size: 16px;
        }


        /* SUBMIT */

        .submit-btn {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 25px;

            background: #667eea;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.3s;
        }


        .submit-btn:hover {

            background: #4f5fd1;

            transform: scale(1.02);
        }


        /* BACK */

        .back {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }


        .back:hover {

            text-decoration: underline;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .container {

                padding: 25px 18px;

            }

            h1 {

                font-size: 25px;

            }

            .header-icon {

                font-size: 45px;

            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- HEADER -->

        <div class="header">

            <div class="header-icon">
                🗳️
            </div>

            <h1>
                MessVoice Voting
            </h1>

            <p class="subtitle">
                Select your preferred food for each meal
            </p>

        </div>


        <!-- INFORMATION -->

        <div class="info">

            🔐 <strong>One Vote Policy</strong>

            <br>

            You can submit your vote only once.
            Please check your choices before submitting.

        </div>


        <!-- FORM -->

        <form action="/vote" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


            <!-- BREAKFAST -->

            <div class="section">

                <h2 class="section-title">
                    🍳 Breakfast
                </h2>


                <label class="option">

                    <input
                        type="radio"
                        name="breakfast"
                        value="Aloo Paratha"
                        required
                    >

                    <span>
                        Aloo Paratha
                    </span>

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="breakfast"
                        value="Poha"
                    >

                    <span>
                        Poha
                    </span>

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="breakfast"
                        value="Bread Omelette"
                    >

                    <span>
                        Bread Omelette
                    </span>

                </label>

            </div>


            <!-- LUNCH -->

            <div class="section">

                <h2 class="section-title">
                    🍚 Lunch
                </h2>


                <label class="option">

                    <input
                        type="radio"
                        name="lunch"
                        value="Rajma Rice"
                        required
                    >

                    <span>
                        Rajma Rice
                    </span>

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="lunch"
                        value="Chole Rice"
                    >

                    <span>
                        Chole Rice
                    </span>

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="lunch"
                        value="Dal Roti"
                    >

                    <span>
                        Dal Roti
                    </span>

                </label>

            </div>


            <!-- DINNER -->

            <div class="section">

                <h2 class="section-title">
                    🍽️ Dinner
                </h2>


                <label class="option">

                    <input
                        type="radio"
                        name="dinner"
                        value="Paneer"
                        required
                    >

                    <span>
                        Paneer
                    </span>

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="dinner"
                        value="Chole Bhature"
                    >

                    <span>
                        Chole Bhature
                    </span>

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="dinner"
                        value="Mix Veg"
                    >

                    <span>
                        Mix Veg
                    </span>

                </label>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit-btn"
            >

                🗳️ Submit My Vote

            </button>


        </form>


        <!-- BACK -->

        <a
            href="/dashboard"
            class="back"
        >

            ← Back to Dashboard

        </a>


    </div>


</body>

</html>
