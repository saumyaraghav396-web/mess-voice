<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MessVoice | Reset Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .reset-box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        p {
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="reset-box">
        <h1>🔐 MessVoice</h1>
        <p>Reset your password</p>

        <form action="/forgot-password" method="POST">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <input
                type="text"
                name="student_id"
                placeholder="Enter Student ID"
                required
            >

            <input
                type="text"
                name="name"
                placeholder="Enter Registered Student Name"
                required
            >

            <input
                type="password"
                name="new_password"
                placeholder="Enter New Password (minimum 12 characters)"
                minlength="12"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm New Password"
                minlength="12"
                required
            >

            <button type="submit">Reset Password</button>
        </form>

        <a href="/login" class="back">← Back to Login</a>
    </div>
</body>
</html>
